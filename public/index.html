<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#241619" />
<meta name="mobile-web-app-capable" content="yes" />
<title>SHBN – Fresh Processing Records System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2F0;
  --surface:#FFFFFF;
  --surface-alt:#F7F5F3;
  --ink:#1F1A1A;
  --ink-2:#5E5757;
  --ink-3:#8A8282;
  --line:#E4E0DD;
  --line-strong:#CFC9C5;
  --primary:#8C2F39;
  --primary-dark:#6F232C;
  --primary-tint:#F6E6E5;
  --side:#241619;
  --side-ink:#E8DDDB;
  --side-dim:#A89A98;
  --green:#2F6B4F;  --green-tint:#E3F0E9;
  --amber:#9A5B00;  --amber-tint:#FBEBD0;
  --danger:#B3261E; --danger-tint:#FBE4E2;
  --radius:10px;
  --shadow:0 1px 2px rgba(36,22,25,.06), 0 2px 10px rgba(36,22,25,.05);
  --sidebar-w:256px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{margin:0;font-weight:600;}
.mono,.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;font-size:14px;}
a{color:var(--primary);}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;}
.sidebar{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.side-brand{display:flex;gap:12px;align-items:center;padding:22px 20px 18px;}
.side-mark{width:40px;height:40px;border-radius:10px;background:var(--primary);display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.5px;color:#fff;}
.side-title{font-weight:600;font-size:15px;line-height:1.2;color:#fff;}
.side-sub{font-size:12px;color:var(--side-dim);margin-top:2px;}
.nav{padding:6px 12px 20px;display:flex;flex-direction:column;gap:2px;}
.nav-group{margin:16px 8px 6px;font-size:12px;color:var(--side-dim);font-weight:500;display:flex;align-items:center;gap:8px;}
.nav-group .mk{font-size:15px;}
.nav a,.nav .nav-off{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:14px;position:relative;}
.nav a:hover{background:rgba(255,255,255,.07);}
.nav a.active{background:rgba(255,255,255,.12);color:#fff;}
.nav a.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#E8A39B;}
.nav .nav-off{color:var(--side-dim);cursor:default;}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.9;}
.badge{margin-left:auto;background:#E8A39B;color:#3A1519;border-radius:999px;font-size:11.5px;font-weight:700;padding:1px 8px;min-width:22px;text-align:center;}
.soon{margin-left:auto;font-size:11px;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:0 8px;color:var(--side-dim);}
.side-foot{margin-top:auto;padding:14px 20px;font-size:12px;color:var(--side-dim);border-top:1px solid rgba(255,255,255,.08);}

.main{min-width:0;}
.scrim{display:none;}
.topbar-m{display:none;}
.page{max-width:1120px;margin:0 auto;padding:28px 28px 70px;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.page-head h1{font-size:24px;letter-spacing:-.2px;}
.page-head p{margin:4px 0 0;color:var(--ink-2);font-size:14px;}

@media (max-width:900px){
  .shell{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);transform:translateX(-100%);transition:transform .2s;z-index:60;}
  body.nav-open .sidebar{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4);}
  .scrim{position:fixed;inset:0;background:rgba(20,10,12,.45);z-index:50;}
  body.nav-open .scrim{display:block;}
  .topbar-m{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;}
  .topbar-m button{background:none;border:1px solid var(--line-strong);border-radius:8px;width:38px;height:38px;display:grid;place-items:center;}
  .topbar-m strong{font-weight:600;}
  .page{padding:20px 16px 60px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}

/* ---------- cards & forms ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-bottom:18px;}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px;justify-content:space-between;}
.card-title .step{width:22px;height:22px;border-radius:50%;background:var(--primary-tint);color:var(--primary-dark);display:inline-grid;place-items:center;font-size:12px;font-weight:600;margin-right:8px;}
.hint{font-size:13px;color:var(--ink-2);margin:-6px 0 14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:minmax(0,1fr);}}
.field{min-width:0;}
.field select,.field input{max-width:100%;}
.field select{text-overflow:ellipsis;}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:13px;font-weight:500;color:var(--ink-2);}
.field input,.field select,.inline-input{padding:9px 12px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--ink);outline:none;transition:border-color .12s, box-shadow .12s;}
.field input:focus,.field select:focus,.inline-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);}
.field input:disabled,.field select:disabled{background:var(--surface-alt);color:var(--ink-3);cursor:not-allowed;}
.field input[readonly]{background:var(--surface-alt);color:var(--ink-2);}
.uc{text-transform:uppercase;}
.uc::placeholder{text-transform:none;}
.inline-input{width:96px;padding:6px 8px;}
.gated.locked{opacity:.5;pointer-events:none;}
.note{font-size:13px;border-radius:8px;padding:9px 12px;margin-bottom:14px;border:1px solid;}
.note.warn{color:var(--amber);background:var(--amber-tint);border-color:#E9C58E;}
.note.err{color:var(--danger);background:var(--danger-tint);border-color:#EDB4AF;}

.btn{border:1px solid transparent;border-radius:8px;padding:9px 16px;font-weight:600;font-size:14px;transition:background .15s;display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-primary:disabled{background:#CDBDBC;cursor:not-allowed;}
.btn-outline{background:#fff;color:var(--primary);border-color:var(--primary);}
.btn-outline:hover{background:var(--primary-tint);}
.btn-outline:disabled{color:var(--ink-3);border-color:var(--line-strong);cursor:not-allowed;background:#fff;}
.btn-ghost{background:var(--surface-alt);color:var(--ink);border-color:var(--line);}
.btn-ghost:hover{background:var(--line);}
.btn-danger{background:#fff;color:var(--danger);border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-tint);}
.btn-sm{padding:5px 11px;font-size:13px;border-radius:6px;}
.btn-block{width:100%;justify-content:center;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;align-items:center;}

table{width:100%;border-collapse:collapse;font-size:14px;}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:9px 10px;border-bottom:1px solid var(--line-strong);background:var(--surface-alt);white-space:nowrap;}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--line);margin-bottom:8px;}
.empty-row td{text-align:center;color:var(--ink-3);padding:26px;}
td.r,th.r{text-align:right;}
th.copy-col{cursor:pointer;user-select:none;}
th.copy-col:hover{color:var(--primary);background:var(--primary-tint);}
tr.grp-start td{border-top:2px solid var(--line-strong);}
tr.clickable{cursor:pointer;}
tr.clickable:hover td{background:var(--surface-alt);}

.summary-strip{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px dashed var(--line-strong);}
.summary-box{flex:1;min-width:140px;background:var(--surface-alt);border:1px solid var(--line);border-radius:8px;padding:10px 14px;}
.summary-box .lbl{font-size:13px;color:var(--ink-2);}
.summary-box .val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;margin-top:2px;}
.summary-box.bad{background:var(--danger-tint);border-color:#EDB4AF;}
.summary-box.bad .val{color:var(--danger);}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 10px 2px 8px;border-radius:999px;white-space:nowrap;}
.pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.pill.pending{color:var(--amber);background:var(--amber-tint);}
.pill.done{color:var(--green);background:var(--green-tint);}

.list-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:9px;cursor:pointer;transition:border-color .12s;flex-wrap:wrap;}
.list-item:hover{border-color:var(--primary);}
.li-title{font-weight:600;}
.li-sub{font-size:13px;color:var(--ink-2);}
.li-meta{display:flex;align-items:center;gap:10px;}
.back-link{display:inline-flex;gap:6px;align-items:center;color:var(--primary);font-weight:600;font-size:14px;margin-bottom:14px;background:none;border:none;padding:0;text-decoration:none;}
.back-link:hover{text-decoration:underline;}
.divider-label{margin:20px 0 12px;font-weight:600;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:10px;}
.divider-label::after{content:"";flex:1;height:1px;background:var(--line);}
.loading{text-align:center;padding:60px 20px;color:var(--ink-2);}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:flex-end;}
.tools .field{margin:0;}

/* ---------- dashboard ---------- */
.entry-cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px;}
@media (max-width:760px){.entry-cards{grid-template-columns:1fr;}}
.ticket{display:grid;grid-template-columns:84px 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);overflow:hidden;position:relative;transition:transform .15s, border-color .15s;}
a.ticket:hover{border-color:var(--primary);transform:translateY(-2px);}
.ticket .stub{display:grid;place-items:center;font-size:32px;background:var(--primary-tint);border-right:2px dashed var(--line-strong);position:relative;}
.ticket .stub::before,.ticket .stub::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line);}
.ticket .stub::before{top:-9px;} .ticket .stub::after{bottom:-9px;}
.ticket .body{padding:18px 20px;}
.ticket h3{font-size:17px;}
.ticket p{margin:4px 0 12px;color:var(--ink-2);font-size:13.5px;}
.ticket .go{font-weight:600;color:var(--primary);display:inline-flex;gap:6px;align-items:center;}
.ticket.off{background:var(--surface-alt);box-shadow:none;}
.ticket.off .stub{background:#ECE9E6;filter:grayscale(1);opacity:.7;}
.ticket.off .go{color:var(--ink-3);}
.section-h{font-size:15px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px;}
@media (max-width:980px){.stats{grid-template-columns:1fr 1fr;}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.stat .lbl{font-size:13px;color:var(--ink-2);}
.stat .big{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:500;margin:4px 0 2px;line-height:1.15;}
.stat .sub{font-size:12.5px;color:var(--ink-3);}
.stat.attn{border-color:#E9C58E;background:#FFFBF4;}
.stat.attn .sub{color:var(--amber);font-weight:500;}

/* ---------- toast / modal ---------- */
#toastRoot{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:999;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);max-width:340px;animation:slideIn .2s ease-out;}
.toast.success{background:var(--green);} .toast.error{background:var(--danger);}
@keyframes slideIn{from{transform:translateY(10px);opacity:0;}to{transform:none;opacity:1;}}
#modalRoot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(36,22,25,.5);z-index:998;padding:20px;}
#modalRoot.open{display:flex;}
.modal-box{background:#fff;border-radius:12px;padding:24px;max-width:400px;width:100%;box-shadow:var(--shadow);}
.modal-box h3{margin-bottom:8px;color:var(--danger);}
.modal-box p{color:var(--ink-2);margin:0 0 18px;}
.login-wrap{max-width:360px;margin:50px auto;}

#printArea{display:none;}
@media print{
  #shell,#toastRoot,#modalRoot{display:none !important;}
  body{background:#fff;}
  #printArea{display:block !important;width:100%;padding:24px;color:#000;font-family:'IBM Plex Sans',sans-serif;}
  .print-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:2px;}
  .print-sub{text-align:center;font-size:12px;margin-bottom:16px;}
  .print-meta{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:12px;}
  .print-table{width:100%;border-collapse:collapse;font-size:11.5px;}
  .print-table th,.print-table td{border:1px solid #999;padding:5px 6px;text-align:center;background:none;color:#000;}
  .print-table tr:last-child td{border-bottom:1px solid #999 !important;}
  .print-footer{margin-top:18px;font-size:12.5px;line-height:2;}
  .print-operation{margin-top:34px;font-size:12.5px;}
  .op-title{font-weight:700;margin-bottom:50px;}
  .op-row{display:flex;justify-content:space-between;gap:60px;}
  .op-row-labels{margin-top:44px;}
  .op-col{flex:1;text-align:center;}
  .op-line{border-bottom:1px solid #333;height:1px;width:65%;margin:0 auto 8px;}
  .op-line-tall{margin-top:50px;}
}

/* ---------- mobile / PDA ---------- */
html{-webkit-text-size-adjust:100%;}
body{-webkit-tap-highlight-color:transparent;overflow-x:hidden;}
.sub-mono{color:var(--ink-3);font-size:12px;}
@media (max-width:900px){
  body.nav-open{overflow:hidden;}
  .topbar-m{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));}
  .topbar-m button{width:44px;height:44px;}
  .nav a,.nav .nav-off{padding:13px 12px;}
  .page{padding:16px 12px calc(60px + env(safe-area-inset-bottom));}
  .page-head h1{font-size:20px;}
  .card{padding:16px 14px;}
  .field input,.field select,.inline-input{min-height:44px;font-size:16px;}
  .inline-input{width:110px;}
  .btn{min-height:44px;padding:10px 16px;}
  .btn-sm{min-height:38px;}
  .stat .big{font-size:26px;}
  .stat{padding:14px;}
  .summary-box{min-width:30%;padding:8px 10px;}
  .summary-box .val{font-size:18px;}
  .tools .field{flex:1 1 100%;}
  .ticket{grid-template-columns:64px 1fr;}
  .ticket .body{padding:14px;}
  #toastRoot{left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));}
  .toast{max-width:none;}
  .list-item{padding:12px;}
}
@media (max-width:640px){
  .stats{grid-template-columns:1fr 1fr;gap:10px;}
  .table-wrap:has(table.rt){border:none;overflow:visible;}
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%;}
  table.rt thead{display:none;}
  table.rt tr{border:1px solid var(--line);border-radius:9px;padding:6px 4px;margin-bottom:10px;background:#fff;}
  table.rt tr.empty-row{border:none;}
  table.rt td{display:flex;justify-content:space-between;align-items:center;gap:14px;border:none;padding:5px 10px;text-align:right;}
  table.rt td::before{font-family:'IBM Plex Sans',system-ui,sans-serif;content:attr(data-label);color:var(--ink-2);font-weight:500;text-align:left;flex:none;font-size:13px;}
  table.rt td[data-label=""]{justify-content:flex-end;}
  table.rt td[data-label=""]::before{display:none;}
  table.rt td.empty,table.rt .empty-row td{display:block;text-align:center;}
  table.rt .empty-row td::before{display:none;}
  table.rt tr.clickable:active{background:var(--surface-alt);}
}

.seg{display:inline-flex;border:1px solid var(--line-s,#cfc8c4);border-radius:10px;overflow:hidden;margin-bottom:16px;background:var(--surface);}
.seg button{border:0;background:transparent;padding:10px 16px;font:inherit;font-weight:600;color:var(--ink-2);cursor:pointer;}
.seg button.on{background:var(--primary);color:#fff;}
.admin-boxes{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;}
.admin-box{display:flex;flex-direction:column;gap:3px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);text-decoration:none;}
.admin-box span{font-size:13px;color:var(--ink-2);}
.admin-box:hover{border-color:var(--primary);}
.admin-box.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);background:var(--primary-tint,#fbf3f4);}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:14px;}
.check input{margin-top:3px;width:18px;height:18px;}
.plu-hint{font-size:12.5px;margin-top:4px;min-height:18px;color:var(--ink-2);}
.plu-hint.err{color:var(--danger);} .plu-hint.ok{color:#2f6b3d;}
.batch{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--surface);}
.batch.out{border-color:var(--primary);}
.batch-info{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.batch-btns{display:flex;gap:6px;flex-wrap:wrap;}
.recent-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:900px){.recent-grid,.admin-boxes{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="side-brand">
      <div class="side-mark">FPRS</div>
      <div><div class="side-title">Fresh Processing<br>Records</div><div class="side-sub">SHBN · Fresh Market</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Outlet SEGSHBN</div>
  </aside>
  <div class="scrim" onclick="toggleNav(false)"></div>
  <div class="main">
    <div class="topbar-m">
      <button onclick="toggleNav(true)" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <strong>Fresh Processing Records</strong>
    </div>
    <main class="page" id="content"></main>
  </div>
</div>
<div id="printArea"></div>
<div id="toastRoot" role="status" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
/* ============================= CONFIG / STATE ============================= */
const TZ = 'Asia/Kuala_Lumpur';
let ITEMS = { base: [], cut: [] };       // each: {plu, description, material, cost, active}
let pendingCount = null;
let renderToken = 0;

const STATE = {
  draft: null,                           // New Entry form
  it: null,                              // IT detail: working copy of the entry
  itForm: { matA:'', matB:'', wd:'', by:'', sys:'' },
  itCalc: null,
  admin: { base: [], cut: [] },
  records: { month: '', status: 'all', q: '', entries: [] },
  fruitDraft: null, fruitIt: null, fruitForm: { matA:'', matB:'', by:'' }, copied: {},
  fruitRec: { month: '', status: 'all', q: '', entries: [] },
  fruitSearch: '', adminList: 'chicken',
  adj: { type: 'chicken', month: '', status: 'all', q: '', entries: [] }, adjC: null, adjF: null,
};

/* ============================= API ============================= */
async function api(path, { method = 'GET', body, admin = false } = {}) {
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  if (admin) headers['x-admin-password'] = sessionStorage.getItem('fprs:admin') || '';
  let res;
  try { res = await fetch('/api/' + path, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error('Cannot reach the server. Check your connection.'); }
  let data = null; try { data = await res.json(); } catch (e) {}
  if (!res.ok || !data || data.ok === false) throw new Error((data && data.error) || ('Server responded with ' + res.status));
  return data;
}

function downloadCsv(rows, filename) {

  const csv = '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');

function tzParts(ms) {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day:'numeric', month:'numeric', year:'numeric', hour:'numeric', minute:'2-digit', hour12:true }).formatToParts(new Date(ms));
  const g = (t) => p.find(x => x.type === t).value;
  return { d:String(+g('day')), m:String(+g('month')), y:g('year'), h:g('hour'), min:g('minute'), ap:g('dayPeriod').toUpperCase() };
}
// d.M.yyyy h.mmAM – the same format as the old sheet, always in Malaysia time
function fmtStamp(ms) { if (!ms) return ''; const t = tzParts(ms); return `${t.d}.${t.m}.${t.y} ${t.h}.${t.min}${t.ap}`; }
function monthKey(ms) { const t = tzParts(ms); return `${t.y}-${String(t.m).padStart(2,'0')}`; }
function monthLabel(key) { const [y,m] = key.split('-'); return new Date(Date.UTC(+y, +m-1, 1)).toLocaleString('en-GB', { month:'long', year:'numeric', timeZone:'UTC' }); }
function ago(ms) {
  const mins = Math.floor((Date.now() - ms) / 60000);
  if (mins < 60) return Math.max(mins,1) + ' min ago';
  const h = Math.floor(mins / 60); if (h < 24) return h + ' hr ago';
  const d = Math.floor(h / 24); return d + (d === 1 ? ' day ago' : ' days ago');
}
function upperize(el) { const pos = el.selectionStart; el.value = el.value.toUpperCase(); try { el.setSelectionRange(pos, pos); } catch (e) {} return el.value; }

function toast(msg, type) {

  document.getElementById('toastRoot').appendChild(el); setTimeout(() => el.remove(), 3400);
}

async function copyColumn(tableId, colIndex) {
  const rows = Array.from(document.querySelectorAll('#' + tableId + ' tbody tr'));
  const values = rows.map(r => r.children[colIndex] ? r.children[colIndex].textContent.trim() : '').filter(v => v !== '');

  try { await navigator.clipboard.writeText(values.join('\n')); toast(`Copied ${values.length} value(s).`, 'success'); }
  catch (e) { toast('Could not copy – your browser blocked clipboard access.', 'error'); }
}

function onDraftText(field, value) { STATE.draft[field] = value; updateGating(); }

  };
  gate('baseCard', baseReady, 'Enter staff and supervisor names above to continue.', ['basePluSelect', 'baseQtyInput']);

function onAddCutPart() {
  const sel = document.getElementById('cutPluSelect'), qtyInput = document.getElementById('cutQtyInput');
  const plu = sel.value, qty = Number(qtyInput.value);
  if (!plu) { toast('Select a cut part PLU first.', 'error'); return; }

  const item = findItem('cut', plu);

  if (existing) existing.qty = round2(existing.qty + qty);

function recalcSummary() {
  const strip = document.getElementById('summaryStrip'); if (!strip) return;
  const d = STATE.draft;
  const baseQty = Number(d.baseQty) || 0;
  const totalCut = round2(d.cutParts.reduce((s, c) => s + Number(c.qty), 0));
  const diff = round2(baseQty - totalCut);
  strip.innerHTML = `
    <div class="summary-box"><div class="lbl">Base product qty (kg)</div><div class="val">${fmtQty(baseQty)}</div></div>
    <div class="summary-box"><div class="lbl">Total cut parts qty (kg)</div><div class="val">${fmtQty(totalCut)}</div></div>
    <div class="summary-box ${diff < 0 ? 'bad' : ''}"><div class="lbl">Difference (kg)</div><div class="val">${fmtQty(diff)}</div></div>`;
  document.getElementById('diffErrorBox').innerHTML = diff < 0
    ? `<div class="note err">Negative weight difference. Check the quantities: cut parts cannot weigh more than the base product.</div>` : '';
  const valid = d.staff.trim() && d.supervisor.trim() && d.basePlu && baseQty > 0 && d.cutParts.length > 0 && diff >= 0;
  document.getElementById('submitEntryBtn').disabled = !valid;
}

async function submitEntry() {
  const d = STATE.draft;
  const btn = document.getElementById('submitEntryBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    await api('entries', { method: 'POST', body: {

// Any quantity change makes an earlier calculation stale - clear it so it can't be submitted by mistake.
function invalidateCalc() {
  if (!STATE.itCalc) return;
  STATE.itCalc = null;
  const a = document.getElementById('calcArea'); if (a) a.innerHTML = calcAreaHTML();
}
function recalcITSummary() {
  const e = STATE.it;
  e.totalCutQty = round2(e.cutParts.reduce((s, c) => s + Number(c.qty || 0), 0));
  e.difference = round2((Number(e.base.qty) || 0) - e.totalCutQty);
  const strip = document.getElementById('itSummaryStrip'); if (strip) strip.innerHTML = itSummaryHTML(e);
  const wd = document.getElementById('itWdContainer'); if (wd) wd.innerHTML = itWdHTML(e, false);
  invalidateCalc();
}
function onEditBaseQtyIT(v) { STATE.it.base.qty = Number(v) || 0; recalcITSummary(); }
function onEditCutQtyIT(idx, v) { STATE.it.cutParts[idx].qty = Number(v) || 0; recalcITSummary(); }
function removeCutPartIT(idx) { STATE.it.cutParts.splice(idx, 1); recalcITSummary(); renderITDetail(); }
function onAddCutPartIT() {
  const e = STATE.it;
  const plu = document.getElementById('itAddCutPluSelect').value, qty = Number(document.getElementById('itAddCutQtyInput').value);
  if (!plu) { toast('Select a cut part PLU first.', 'error'); return; }
  if (!qty || qty <= 0) { toast('Enter a valid quantity.', 'error'); return; }
  const item = findItem('cut', plu);
  const existing = e.cutParts.find(c => c.plu === plu);
  if (existing) existing.qty = round2(Number(existing.qty) + qty);
  else e.cutParts.push({ plu, description: item.description, material: item.material, qty: round2(qty) });
  recalcITSummary(); renderITDetail();
}

function itPayload() {
  const e = STATE.it;
  return { baseQty: Number(e.base.qty), cutParts: e.cutParts.map(c => ({ plu: c.plu, qty: Number(c.qty) })) };
}
function checkITQuantities() {
  const e = STATE.it;
  if (!e.cutParts.length) { toast('At least one cut part is required.', 'error'); return false; }
  if (e.cutParts.some(c => !(Number(c.qty) > 0)) || !(Number(e.base.qty) > 0)) { toast('All quantities must be greater than 0.', 'error'); return false; }
  if (e.difference < 0) { showModal('Negative weight difference', 'Total cut parts quantity cannot exceed the base product quantity. Please check the quantities.'); return false; }
  return true;
}
async function saveITCorrections() {
  if (!checkITQuantities()) return;
  try { await api('entries?id=' + encodeURIComponent(STATE.it.id), { method: 'PATCH', body: itPayload() }); }
  catch (err) { toast(err.message, 'error'); return; }
  toast('Corrections saved.', 'success');
}

// Same valuation logic as the old app.
function calculateEntry() {
  const e = STATE.it;
  if (STATE.itForm.sys === '' || !Number.isFinite(Number(STATE.itForm.sys))) { toast('Enter the system amount first.', 'error'); return; }
  if (!checkITQuantities()) return;
  const sysAmt = Number(STATE.itForm.sys);
  const baseCost = findCost('base', e.base.plu);
  const itemCount = e.cutParts.length || 1;
  const totalCutQty = e.cutParts.reduce((s, c) => s + Number(c.qty), 0);
  const product1 = baseCost * totalCutQty;
  const raw = e.cutParts.map(c => { const cost = findCost('cut', c.plu); return { plu:c.plu, description:c.description, material:c.material, qty:c.qty, cost, product: cost * c.qty }; });
  const rawTotal = raw.reduce((s, r) => s + r.product, 0);
  const diff1 = rawTotal - product1, alloc1 = diff1 / itemCount;
  const diff2 = product1 - sysAmt, alloc2 = diff2 / itemCount;
  const results = raw.map(r => ({ plu:r.plu, description:r.description, material:r.material, qty:r.qty, endValue: (r.product - alloc1) - alloc2 }));
  STATE.itCalc = { product1, rawTotal, diff1, alloc1, diff2, alloc2, systemAmount: sysAmt, results };
  document.getElementById('calcArea').innerHTML = calcAreaHTML();
  toast('Calculation complete.', 'success');
}

async function submitITEntry() {
  const e = STATE.it, F = STATE.itForm;
  if (!checkITQuantities()) return;
  if (!STATE.itCalc) { toast('Calculate before submitting.', 'error'); return; }
  if (!F.matA.trim() || !F.matB.trim()) { toast('Both material document fields are required.', 'error'); return; }
  if (e.difference !== 0 && !F.wd.trim()) { toast('Weight discrepancy material document is required.', 'error'); return; }
  if (!F.by.trim()) { toast('Enter who is keying this in.', 'error'); return; }
  const btn = document.getElementById('submitItBtn'); btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const res = await api('entries?id=' + encodeURIComponent(e.id), { method: 'PATCH', body: { ...itPayload(), complete: {
      systemAmount: STATE.itCalc.systemAmount, calculated: STATE.itCalc,
      materialDocA: F.matA, materialDocB: F.matB, weightDiscrepancyDoc: F.wd, keyedInBy: F.by } } });
    STATE.it = res.entry; STATE.itCalc = res.entry.calculated;
  } catch (err) { toast(err.message, 'error'); btn.disabled = false; btn.textContent = 'Submit'; return; }
  toast('Entry processed.', 'success');
  refreshBadge(); renderITDetail();
}

let FRUIT = [];   // masterlist rows: {plu, material, description, uom, category, role, active}
async function loadFruit() { FRUIT = (await api('mf-items')).items; }
const fruitOutputs = () => FRUIT.filter(i => i.role === 'output' && i.active);
const uomLabel = (u) => (u === 'KG' ? 'kg' : 'ea');

// Scanned label 28 + 5-digit PLU + 11 digits (285010600000000000) -> 50106. Anything else is left as typed.
function normalizePlu(raw) { const s = String(raw ?? '').trim(); const m = /^28(\d{5})\d{11}$/.exec(s); return m ? m[1] : s; }
function lookupFruit(raw) {
  const typed = String(raw ?? '').trim(), plu = normalizePlu(typed);
  const hit = FRUIT.find(i => i.plu === plu && i.active);
  return { plu, typed, scanned: plu !== typed, item: hit && hit.role === 'input' ? hit : null, isOutput: !!hit && hit.role === 'output' };
}
function gateCard(cardId, ready, msg, ids) {
  const card = document.getElementById(cardId); if (!card) return;
  card.classList.toggle('locked', !ready);
  ids.forEach(id => { const el = card.querySelector('#' + id); if (el) el.disabled = !ready; });
  const hint = card.querySelector('[data-lock]');
  if (ready && hint) hint.remove();
  if (!ready && !hint) card.querySelector('.card-title').insertAdjacentHTML('afterend', `<div class="note warn" data-lock>${msg}</div>`);
}

// ---- PLU entry widget (shared by New entry, Pending entry and Admin edit) ----
function pluWidgetHTML(addHandler, locked) {
  return `
    <div class="grid3">
      <div class="field"><label for="fPlu">PLU code</label>
        <input id="fPlu" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="Scan or type PLU" ${locked ? 'disabled' : ''}
          oninput="onFruitPluInput(this)" onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('fQty').focus();}"/></div>
      <div class="field"><label>Description</label><input id="fDesc" type="text" readonly/></div>
      <div class="field"><label>Unit</label><input id="fUom" type="text" readonly/></div>
    </div>
    <div id="fPluHint" class="plu-hint"></div>
    <div class="grid3">
      <div class="field"><label for="fQty" id="fQtyLabel">Quantity</label>
        <input id="fQty" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0" ${locked ? 'disabled' : ''}
          onkeydown="if(event.key==='Enter'){event.preventDefault();${addHandler}();}"/></div>
      <div class="field"><label>&nbsp;</label><button class="btn btn-primary" id="fAddBtn" onclick="${addHandler}()" ${locked ? 'disabled' : ''}>+ Add item</button></div>
      <div class="field"><label>Material</label><input id="fMat" type="text" readonly/></div>
    </div>`;
}
function onFruitPluInput(el) {
  const r = lookupFruit(el.value);
  const set = (id, v) => { const n = document.getElementById(id); if (n) n.value = v; };
  set('fDesc', r.item ? r.item.description : ''); set('fUom', r.item ? r.item.uom : ''); set('fMat', r.item ? r.item.material : '');
  let msg = '', cls = '';
  if (r.item) { if (r.scanned) msg = `Scanned label read as PLU ${r.plu}.`; }
  else if (r.isOutput) { msg = 'This is the Mixed Fruit BB product. It is entered in the Mixed Fruit BB step, not as an item.'; cls = 'warn'; }
  else if (r.typed.length >= 5 && !FRUIT.some(i => i.plu.startsWith(r.plu))) { msg = `PLU ${r.plu} is not in the masterlist.`; cls = 'err'; }
  const hint = document.getElementById('fPluHint'); hint.textContent = msg; hint.className = 'plu-hint ' + cls;
  const q = document.getElementById('fQty'), ea = r.item && r.item.uom === 'EA';
  if (q) { q.step = ea ? '1' : '0.01'; q.inputMode = ea ? 'numeric' : 'decimal'; }
  const ql = document.getElementById('fQtyLabel'); if (ql) ql.textContent = r.item ? `Quantity (${uomLabel(r.item.uom)})` : 'Quantity';
}
function readFruitInputs() {
  const el = document.getElementById('fPlu'), r = lookupFruit(el.value);
  if (!r.typed) { toast('Enter or scan a PLU code.', 'error'); el.focus(); return null; }
  if (!r.item) { toast(r.isOutput ? 'BB FRUITS is entered in the Mixed Fruit BB step.' : `PLU ${r.plu} is not in the masterlist.`, 'error'); el.select(); return null; }
  const qEl = document.getElementById('fQty'), qty = Number(qEl.value);
  if (!(qty > 0)) { toast('Enter a quantity greater than 0.', 'error'); qEl.focus(); return null; }
  if (r.item.uom === 'EA' && !Number.isInteger(qty)) { toast('Unit is EA, so the quantity must be a whole number.', 'error'); qEl.focus(); return null; }
  return { plu: r.item.plu, description: r.item.description, material: r.item.material, uom: r.item.uom, qty: round2(qty) };
}
function clearFruitInputs() {
  ['fPlu', 'fQty', 'fDesc', 'fUom', 'fMat'].forEach(id => { const n = document.getElementById(id); if (n) n.value = ''; });
  onFruitPluInput(document.getElementById('fPlu')); document.getElementById('fPlu').focus();
}
function mergeFruitItem(list, it) {
  const ex = list.find(x => x.plu === it.plu);
  if (ex) ex.qty = round2(ex.qty + it.qty); else list.push(it);
}
function fruitQtyInput(it, idx, handler) {
  return `<input class="inline-input" type="number" inputmode="${it.uom === 'EA' ? 'numeric' : 'decimal'}" min="0" step="${it.uom === 'EA' ? 1 : 0.01}" value="${esc(it.qty)}" aria-label="Quantity for ${esc(it.description)}" oninput="${handler}(${idx}, this.value)"/>`;
}
function outputSelectHTML(id, selected, outputs, onchange, disabled) {
  return `<select id="${id}" ${onchange ? `onchange="${onchange}"` : ''} ${disabled ? 'disabled' : ''}>${outputs.map(o => `<option value="${esc(o.plu)}" ${o.plu === selected ? 'selected' : ''}>${esc(o.description)} (${esc(o.plu)})</option>`).join('')}</select>`;
}

async function submitFruitIT() {

const batchSize = () => Math.min(Math.max(parseInt(localStorage.getItem('fprs:batchSize'), 10) || 12, 1), 500);
function setBatchSize(v) {
  const n = Math.min(Math.max(parseInt(v, 10) || 12, 1), 500);
  try { localStorage.setItem('fprs:batchSize', String(n)); } catch (e) {}
  document.getElementById('batchSize').value = n; STATE.copied = {}; refreshBatches();
}
function refreshBatches() { const el = document.getElementById('batchList'); if (el) el.innerHTML = batchListHTML(); }
function batchListHTML() {
  const e = STATE.fruitIt, size = batchSize(), n = e.items.length;
  if (!n) return '<div class="hint">No items to copy.</div>';
  const btns = (key) => `
    <button class="btn btn-outline btn-sm" onclick="copyBatch('${key}','material')">Material</button>
    <button class="btn btn-outline btn-sm" onclick="copyBatch('${key}','qty')">Qty</button>`;
  let html = '';
  for (let b = 0, from = 0; from < n; b++, from += size) {
    const to = Math.min(n, from + size);
    html += `<div class="batch"><div class="batch-info"><strong>Batch ${b + 1}</strong> <span class="li-sub">rows ${from + 1}–${to} · ${to - from} item${to - from === 1 ? '' : 's'}</span>
      ${STATE.copied[b] ? `<span class="pill done">${ICON.check}Copied</span>` : ''}</div><div class="batch-btns">${btns(b)}</div></div>`;
  }
  html += `<div class="batch out"><div class="batch-info"><strong>Mixed Fruit BB</strong> <span class="li-sub">${esc(e.output.description)} · ${fmtQty(e.output.qty)} ${uomLabel(e.output.uom)}</span>
      ${STATE.copied.out ? `<span class="pill done">${ICON.check}Copied</span>` : ''}</div><div class="batch-btns">${btns('out')}</div></div>`;
  return html;
}
async function copyBatch(key, mode) {
  const e = STATE.fruitIt, size = batchSize();
  const rows = key === 'out' ? [e.output] : e.items.slice(key * size, key * size + size);
  const col = { plu: r => r.plu, material: r => r.material, qty: r => fmtQty(r.qty), both: r => `${r.plu}\t${fmtQty(r.qty)}` }[mode];
  try { await navigator.clipboard.writeText(rows.map(col).join('\n')); }
  catch (err) { toast('Could not copy – your browser blocked clipboard access.', 'error'); return; }
  STATE.copied[key] = true; refreshBatches();
  toast(key === 'out' ? 'Copied Mixed Fruit BB row.' : `Copied batch ${Number(key) + 1} (${rows.length} row${rows.length === 1 ? '' : 's'}).`, 'success');
}

}
async function addFruitMaster() {
  const g = (id) => document.getElementById(id).value.trim();
  const body = { plu: g('nfPlu'), material: g('nfMat'), description: g('nfDesc'), uom: g('nfUom'), role: g('nfRole') };
  if (!body.plu || !body.material || !body.description) { toast('Fill in every field for the new item.', 'error'); return; }
  try { await api('mf-items', { method: 'POST', admin: true, body }); }
  catch (err) { adminErr(err); return; }
  toast('Item added.', 'success'); await loadFruit(); renderAdminMaster();
}

/* ---------- Records adjustment ---------- */
async function pageAdminRecords(_, token) {
  if (!isAdmin()) { renderAdminLogin(); return; }
  const A = STATE.adj; if (!A.month) A.month = monthKey(Date.now());
  await loadAdj(token);
}
async function loadAdj(token) {
  const A = STATE.adj;
  const res = await api(`${A.type === 'chicken' ? 'entries' : 'mf-entries'}?month=${A.month}&limit=2000`);
  if (token !== undefined && stale(token)) return;
  A.entries = res.entries.slice().reverse(); renderAdminRecords();
}
function adjFiltered() {
  const A = STATE.adj, q = A.q.trim().toLowerCase();
  return A.entries.filter(e => (A.status === 'all' || e.status === A.status) && (!q || JSON.stringify(e).toLowerCase().includes(q)));
}
function renderAdminRecords() {
  const A = STATE.adj;
  document.getElementById('content').innerHTML = adminTopHTML('records') + `
    <div class="card">
      <div class="tools">
        <div class="field"><label for="adjType">Record</label><select id="adjType" onchange="onAdjType(this.value)">
          <option value="chicken" ${A.type === 'chicken' ? 'selected' : ''}>Chicken cut parts</option><option value="fruit" ${A.type === 'fruit' ? 'selected' : ''}>Mixed fruit BB</option></select></div>
        <div class="field"><label for="adjMonth">Month</label><input id="adjMonth" type="month" value="${esc(A.month)}" onchange="onAdjMonth(this.value)"/></div>
        <div class="field"><label for="adjStatus">Status</label><select id="adjStatus" onchange="STATE.adj.status=this.value;renderAdjTable()">
          ${[['all','All'],['pending','Pending'],['completed','Processed']].map(([v, l]) => `<option value="${v}" ${A.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="field" style="flex:1;min-width:200px"><label for="adjSearch">Search</label><input id="adjSearch" type="search" placeholder="Name, product, document…" value="${esc(A.q)}" oninput="STATE.adj.q=this.value;renderAdjTable()"/></div>
      </div>
      <div id="adjSummary" class="hint"></div>
      <div class="table-wrap"><table class="rt"><thead><tr><th>Date</th><th>${A.type === 'chicken' ? 'Staff' : 'Record by'}</th><th>Supervisor</th><th>Summary</th><th>Status</th><th></th></tr></thead><tbody id="adjBody"></tbody></table></div>
    </div>`;
  renderAdjTable();
}
function renderAdjTable() {
  const A = STATE.adj, list = adjFiltered(), body = document.getElementById('adjBody'); if (!body) return;
  document.getElementById('adjSummary').textContent = `${list.length} entr${list.length === 1 ? 'y' : 'ies'} in ${monthLabel(A.month)}. Pick Edit to change an entry or Delete to remove it.`;
  body.innerHTML = list.length ? list.map(e => {
    const who = A.type === 'chicken' ? e.staff : e.recordedBy;
    const sum = A.type === 'chicken' ? `${esc(e.base.description)} · ${fmtQty(e.base.qty)} kg<div class="sub-mono">${e.cutParts.length} cut part(s)</div>` : `${esc(e.output.description)} · ${fmtQty(e.output.qty)} ea<div class="sub-mono">${e.items.length} item(s)</div>`;
    return `<tr><td class="mono" data-label="Date" style="white-space:nowrap">${esc(fmtStamp(e.createdAt))}</td><td data-label="${A.type === 'chicken' ? 'Staff' : 'Record by'}">${esc(who)}</td><td data-label="Supervisor">${esc(e.supervisor)}</td>
      <td data-label="Summary">${sum}</td><td data-label="Status">${statusPill(e)}</td>
      <td class="r" data-label="" style="white-space:nowrap"><a class="btn btn-outline btn-sm" href="#/admin/records/${A.type}/${esc(e.id)}">Edit</a>
        <button class="btn btn-danger btn-sm" onclick="askDeleteEntry('${A.type}','${esc(e.id)}')">Delete</button></td></tr>`;
  }).join('') : `<tr class="empty-row"><td colspan="6">No entries match. Try another month or clear the search.</td></tr>`;
}
async function onAdjType(v) { STATE.adj.type = v; STATE.adj.entries = []; try { await loadAdj(); } catch (err) { toast(err.message, 'error'); } }
async function onAdjMonth(v) { if (!v) return; STATE.adj.month = v; try { await loadAdj(); } catch (err) { toast(err.message, 'error'); } }
function askDeleteEntry(type, id, backToList) {
  const list = type === 'chicken' ? STATE.adj.entries : STATE.adj.entries;
  const e = (backToList ? (type === 'chicken' ? STATE.adjC : STATE.adjF) : list.find(x => x.id === id));
  const label = e ? `${fmtStamp(e.createdAt)} by ${type === 'chicken' ? e.staff : e.recordedBy}` : id;
  confirmModal('Delete this entry?', `The ${type === 'chicken' ? 'chicken cut parts' : 'mixed fruit BB'} entry from ${label} will be permanently removed. This cannot be undone.`, 'Delete entry', async () => {
    try { await api(`admin-entries?type=${type}&id=${encodeURIComponent(id)}`, { method: 'DELETE', admin: true }); }
    catch (err) { adminErr(err); return; }
    toast('Entry deleted.', 'success');
    if (backToList) location.hash = '#/admin/records'; else { STATE.adj.entries = STATE.adj.entries.filter(x => x.id !== id); renderAdjTable(); refreshBadge(); }
  });
}

async function pageAdminEdit(m, token) {
  if (!isAdmin()) { renderAdminLogin(); return; }
  const type = m[1], id = m[2];
  const [res] = await Promise.all([api((type === 'chicken' ? 'entries' : 'mf-entries') + '?id=' + encodeURIComponent(id)), loadItems(), loadFruit()]);
  if (stale(token)) return;
  const e = JSON.parse(JSON.stringify(res.entry)); e.reopen = false;
  if (type === 'chicken') { STATE.adjC = e; renderAdjChicken(); } else { STATE.adjF = e; renderAdjFruit(); }
}
const adjBack = `<a class="back-link" href="#/admin/records">&larr; Back to records adjustment</a>`;
const reopenHTML = (fn) => `<label class="check"><input type="checkbox" onchange="${fn}(this.checked)"/> Set back to pending (clears the material documents and sign-off)</label>`;

/* ----- chicken edit ----- */
function renderAdjChicken() {
  const e = STATE.adjC, done = e.status === 'completed';
  const baseList = activeItems('base').slice(); if (!baseList.find(i => i.plu === e.base.plu)) baseList.push({ plu: e.base.plu, description: e.base.description });
  const cutOpts = activeItems('cut').map(i => `<option value="${esc(i.plu)}">${esc(i.plu)} – ${esc(i.description)}</option>`).join('');
  const rows = e.cutParts.length ? e.cutParts.map((c, i) => `<tr><td class="mono" data-label="PLU">${esc(c.plu)}</td><td data-label="Description">${esc(c.description)}</td>
      <td class="mono r" data-label="Qty (kg)"><input class="inline-input" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(c.qty)}" aria-label="Quantity for ${esc(c.description)}" oninput="onAdjCQty(${i}, this.value)"/></td>
      <td class="r" data-label=""><button class="btn btn-danger btn-sm" onclick="removeAdjC(${i})">Remove</button></td></tr>`).join('')
    : `<tr class="empty-row"><td colspan="4">No cut parts. Add at least one.</td></tr>`;
  document.getElementById('content').innerHTML = adjBack + `
    <div class="page-head"><div><h1>Edit entry · Chicken cut parts</h1><p>${esc(fmtStamp(e.createdAt))}</p></div>${statusPill(e)}</div>
    <div class="card"><div class="card-title">Submission</div>
      <div class="grid2">
        <div class="field"><label for="acStaff">Staff</label><input id="acStaff" class="uc" autocapitalize="characters" spellcheck="false" type="text" value="${esc(e.staff)}" oninput="STATE.adjC.staff=upperize(this)"/></div>
        <div class="field"><label for="acSup">Supervisor</label><input id="acSup" class="uc" autocapitalize="characters" spellcheck="false" type="text" value="${esc(e.supervisor)}" oninput="STATE.adjC.supervisor=upperize(this)"/></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="acBase">Base product</label><select id="acBase" onchange="STATE.adjC.base.plu=this.value">${baseList.map(i => `<option value="${esc(i.plu)}" ${i.plu === e.base.plu ? 'selected' : ''}>${esc(i.plu)} – ${esc(i.description)}</option>`).join('')}</select></div>
        <div class="field"><label for="acBaseQty">Base quantity (kg)</label><input id="acBaseQty" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(e.base.qty)}" oninput="onAdjCBaseQty(this.value)"/></div>
      </div>
      <div class="divider-label">Cut parts</div>
      <div class="table-wrap"><table class="rt"><thead><tr><th>PLU</th><th>Description</th><th class="r">Qty (kg)</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="grid3">
        <div class="field"><label for="acAddPlu">Add cut part – PLU</label><select id="acAddPlu"><option value="">Select PLU…</option>${cutOpts}</select></div>
        <div class="field"><label for="acAddQty">Quantity (kg)</label><input id="acAddQty" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"/></div>
        <div class="field"><label>&nbsp;</label><button class="btn btn-primary" onclick="addAdjC()">+ Add cut part</button></div>
      </div>
      <div class="summary-strip" id="acSummary"></div>
    </div>
    ${done ? `<div class="card"><div class="card-title">Material documents and sign-off</div><div id="acDocs"></div>${reopenHTML('onAdjCReopen')}
      ${e.calculated ? '<div class="hint" style="margin-top:10px">Changing quantities or the base product clears the stored valuation for this entry.</div>' : ''}</div>` : ''}
    <div class="btn-row"><button class="btn btn-primary" onclick="saveAdjC()">Save changes</button>
      <button class="btn btn-danger" onclick="askDeleteEntry('chicken','${esc(e.id)}', true)">Delete entry</button><a class="btn btn-ghost" href="#/admin/records">Cancel</a></div>`;
  recalcAdjC();
}
function recalcAdjC() {
  const e = STATE.adjC;
  e.totalCutQty = round2(e.cutParts.reduce((s, c) => s + Number(c.qty || 0), 0));
  e.difference = round2((Number(e.base.qty) || 0) - e.totalCutQty);
  const s = document.getElementById('acSummary'); if (s) s.innerHTML = itSummaryHTML(e);
  const d = document.getElementById('acDocs'); if (d) {
    if (e.reopen) { d.innerHTML = '<div class="hint">The entry will go back to pending when you save.</div>'; return; }
    const keep = (id) => (document.getElementById(id) ? document.getElementById(id).value : null);
    d.innerHTML = `<div class="grid2">
      <div class="field"><label for="acA">Material document A</label><input id="acA" class="uc" autocapitalize="characters" spellcheck="false" type="text" value="${esc(e.materialDocA)}" oninput="STATE.adjC.materialDocA=upperize(this)"/></div>
      <div class="field"><label for="acB">Material document B</label><input id="acB" class="uc" autocapitalize="characters" spellcheck="false" type="text" value="${esc(e.materialDocB)}" oninput="STATE.adjC.materialDocB=upperize(this)"/></div></div>
      <div class="grid2">${e.difference !== 0 ? `<div class="field"><label for="acW">Weight discrepancy material doc (${fmtQty(e.difference)} kg)</label><input id="acW" class="uc" autocapitalize="characters" spellcheck="false" type="text" value="${esc(e.weightDiscrepancyDoc)}" oninput="STATE.adjC.weightDiscrepancyDoc=upperize(this)"/></div>` : ''}
      <div class="field"><label for="acBy">Key in by</label><input id="acBy" class="uc" autocapitalize="characters" spellcheck="false" type="text" value="${esc(e.keyedInBy)}" oninput="STATE.adjC.keyedInBy=upperize(this)"/></div></div>`;
  }
}
function onAdjCBaseQty(v) { STATE.adjC.base.qty = Number(v) || 0; recalcAdjC(); }
function onAdjCQty(i, v) { STATE.adjC.cutParts[i].qty = Number(v) || 0; recalcAdjC(); }
function removeAdjC(i) { STATE.adjC.cutParts.splice(i, 1); renderAdjChicken(); }
function onAdjCReopen(v) { STATE.adjC.reopen = v; recalcAdjC(); }
function addAdjC() {
  const e = STATE.adjC, plu = document.getElementById('acAddPlu').value, qty = Number(document.getElementById('acAddQty').value);
  if (!plu) { toast('Select a cut part PLU first.', 'error'); return; }
  if (!(qty > 0)) { toast('Enter a valid quantity.', 'error'); return; }
  const item = findItem('cut', plu), ex = e.cutParts.find(c => c.plu === plu);
  if (ex) ex.qty = round2(Number(ex.qty) + qty); else e.cutParts.push({ plu, description: item.description, material: item.material, qty: round2(qty) });
  renderAdjChicken();
}
async function saveAdjC() {
  const e = STATE.adjC, done = e.status === 'completed';
  if (!e.staff.trim() || !e.supervisor.trim()) { toast('Staff and supervisor are required.', 'error'); return; }
  if (!e.cutParts.length || e.cutParts.some(c => !(Number(c.qty) > 0)) || !(Number(e.base.qty) > 0)) { toast('All quantities must be greater than 0, with at least one cut part.', 'error'); return; }
  if (e.difference < 0) { showModal('Negative weight difference', 'Total cut parts quantity cannot exceed the base product quantity.'); return; }
  if (done && !e.reopen) {
    if (!e.materialDocA.trim() || !e.materialDocB.trim() || !e.keyedInBy.trim()) { toast('Material documents A and B and Key in by are required for a processed entry.', 'error'); return; }
    if (e.difference !== 0 && !e.weightDiscrepancyDoc.trim()) { toast('Weight discrepancy material document is required.', 'error'); return; }
  }
  try {
    await api('admin-entries?type=chicken&id=' + encodeURIComponent(e.id), { method: 'PUT', admin: true, body: {
      staff: e.staff, supervisor: e.supervisor, basePlu: e.base.plu, baseQty: Number(e.base.qty), cutParts: e.cutParts.map(c => ({ plu: c.plu, qty: Number(c.qty) })),
      materialDocA: e.materialDocA, materialDocB: e.materialDocB, weightDiscrepancyDoc: e.weightDiscrepancyDoc, keyedInBy: e.keyedInBy, reopen: !!e.reopen } });
  } catch (err) { adminErr(err); return; }
  toast('Entry updated.', 'success'); refreshBadge(); location.hash = '#/admin/records';
}

/* ----- fruit edit ----- */
function renderAdjFruit() {
  const e = STATE.adjF, done = e.status === 'completed';
  const outs = fruitOutputs().slice(); if (!outs.find(o => o.plu === e.output.plu)) outs.push({ plu: e.output.plu, description: e.output.description });
  const rows = e.items.length ? e.items.map((x, i) => `<tr><td class="mono" data-label="#">${i + 1}</td><td class="mono" data-label="PLU">${esc(x.plu)}</td><td data-label="Description">${esc(x.description)}</td><td data-label="Unit">${esc(x.uom)}</td>
      <td class="mono r" data-label="Qty">${fruitQtyInput(x, i, 'onAdjFQty')}</td><td class="r" data-label=""><button class="btn btn-danger btn-sm" onclick="removeAdjF(${i})">Remove</button></td></tr>`).join('')
    : `<tr class="empty-row"><td colspan="6">No items. Add at least one.</td></tr>`;
  document.getElementById('content').innerHTML = adjBack + `
    <div class="page-head"><div><h1>Edit entry · Mixed fruit BB</h1><p>${esc(fmtStamp(e.createdAt))}</p></div>${statusPill(e)}</div>
    <div class="card"><div class="card-title">Submission</div>
      <div class="grid2">
        <div class="field"><label for="afBy">Record by</label><input id="afBy" class="uc" autocapitalize="characters" spellcheck="false" type="text" value="${esc(e.recordedBy)}" oninput="STATE.adjF.recordedBy=upperize(this)"/></div>
        <div class="field"><label for="afSup">Supervisor</label><input id="afSup" class="uc" autocapitalize="characters" spellcheck="false" type="text" value="${esc(e.supervisor)}" oninput="STATE.adjF.supervisor=upperize(this)"/></div>
      </div>
      <div class="divider-label">Fruit items</div>
      <div class="table-wrap"><table class="rt"><thead><tr><th>#</th><th>PLU</th><th>Description</th><th>Unit</th><th class="r">Qty</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      ${pluWidgetHTML('addAdjF', false)}
      <div class="divider-label">Mixed Fruit BB</div>
      <div class="grid2">
        <div class="field"><label for="afOut">Product</label>${outputSelectHTML('afOut', e.output.plu, outs, 'onAdjFOut(this.value)', false)}</div>
        <div class="field"><label for="afOutQty">Quantity (ea)</label><input id="afOutQty" type="number" inputmode="numeric" min="0" step="1" value="${esc(e.output.qty)}" oninput="STATE.adjF.output.qty=Number(this.value)||0"/></div>
      </div>
    </div>
    ${done ? `<div class="card"><div class="card-title">Material documents and sign-off</div><div id="afDocs">${adjFDocsHTML()}</div>${reopenHTML('onAdjFReopen')}</div>` : ''}
    <div class="btn-row"><button class="btn btn-primary" onclick="saveAdjF()">Save changes</button>
      <button class="btn btn-danger" onclick="askDeleteEntry('fruit','${esc(e.id)}', true)">Delete entry</button><a class="btn btn-ghost" href="#/admin/records">Cancel</a></div>`;
}
function adjFDocsHTML() {
  const e = STATE.adjF;
  if (e.reopen) return '<div class="hint">The entry will go back to pending when you save.</div>';
  return `<div class="grid2">
    <div class="field"><label for="afA">Material document A</label><input id="afA" class="uc" autocapitalize="characters" spellcheck="false" type="text" value="${esc(e.materialDocA)}" oninput="STATE.adjF.materialDocA=upperize(this)"/></div>
    <div class="field"><label for="afB">Material document B</label><input id="afB" class="uc" autocapitalize="characters" spellcheck="false" type="text" value="${esc(e.materialDocB)}" oninput="STATE.adjF.materialDocB=upperize(this)"/></div></div>
    <div class="field" style="max-width:300px"><label for="afKey">Key in by</label><input id="afKey" class="uc" autocapitalize="characters" spellcheck="false" type="text" value="${esc(e.keyedInBy)}" oninput="STATE.adjF.keyedInBy=upperize(this)"/></div>`;
}
function onAdjFQty(i, v) { STATE.adjF.items[i].qty = Number(v) || 0; }
function removeAdjF(i) { STATE.adjF.items.splice(i, 1); renderAdjFruit(); }
function onAdjFOut(plu) { const o = fruitOutputs().find(x => x.plu === plu); if (o) STATE.adjF.output = { ...STATE.adjF.output, plu: o.plu, description: o.description, material: o.material, uom: o.uom }; }
function onAdjFReopen(v) { STATE.adjF.reopen = v; document.getElementById('afDocs').innerHTML = adjFDocsHTML(); }
function addAdjF() { const it = readFruitInputs(); if (!it) return; mergeFruitItem(STATE.adjF.items, it); renderAdjFruit(); document.getElementById('fPlu').focus(); }
async function saveAdjF() {
  const e = STATE.adjF, done = e.status === 'completed';
  if (!e.recordedBy.trim() || !e.supervisor.trim()) { toast('Record by and supervisor are required.', 'error'); return; }
  if (!e.items.length || e.items.some(x => !(Number(x.qty) > 0) || (x.uom === 'EA' && !Number.isInteger(Number(x.qty))))) { toast('Check the item quantities: more than 0, and whole numbers for EA.', 'error'); return; }
  if (!(Number(e.output.qty) > 0) || !Number.isInteger(Number(e.output.qty))) { toast('Mixed Fruit BB quantity must be a whole number above 0.', 'error'); return; }
  if (done && !e.reopen && (!e.materialDocA.trim() || !e.materialDocB.trim() || !e.keyedInBy.trim())) { toast('Material documents A and B and Key in by are required for a processed entry.', 'error'); return; }
  try {
    await api('admin-entries?type=fruit&id=' + encodeURIComponent(e.id), { method: 'PUT', admin: true, body: {
      recordedBy: e.recordedBy, supervisor: e.supervisor, items: e.items.map(x => ({ plu: x.plu, qty: Number(x.qty) })), outputPlu: e.output.plu, outputQty: Number(e.output.qty),
      materialDocA: e.materialDocA, materialDocB: e.materialDocB, keyedInBy: e.keyedInBy, reopen: !!e.reopen } });
  } catch (err) { adminErr(err); return; }
  toast('Entry updated.', 'success'); refreshBadge(); location.hash = '#/admin/records';
}

/* ============================= START ============================= */
renderNav();
window.addEventListener('hashchange', router);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { toggleNav(false); closeModal(); } });
router();
</script>
